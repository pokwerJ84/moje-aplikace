<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5f9b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Gym Tracker Pro</title>
  <style>
    :root{
      --bg:#eef7ff;--bg2:#f9fcff;--card:#fff;--ink:#15324a;--muted:#66798a;
      --primary:#0b5f9b;--primary2:#4ea9e4;--line:#d7e7f2;--good:#218739;
      --warn:#a75f00;--bad:#b42318;--soft:#eaf5fc;--shadow:0 10px 32px rgba(20,72,109,.12);
    }
    [data-theme="dark"]{
      --bg:#0f1720;--bg2:#111c26;--card:#182632;--ink:#edf7ff;--muted:#a7bac9;
      --primary:#58b8f2;--primary2:#1b7eb7;--line:#2d4353;--good:#68d17d;
      --warn:#ffc36f;--bad:#ff8e86;--soft:#213849;--shadow:0 10px 32px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2) 250px);color:var(--ink)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:105px}
    header{padding:18px 14px 10px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 70%,transparent);z-index:5}
    .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
    h1{font-size:24px;margin:0}.subtitle{font-size:13px;color:var(--muted)}
    .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 11px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .pill{background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center;box-shadow:var(--shadow)}
    .pill b{display:block;font-size:18px}
    main{padding:0 10px}.screen{display:none}.screen.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin:10px 0;box-shadow:var(--shadow)}
    .day-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .day-head h2{margin:0;font-size:20px}.day-head p{margin:3px 0;color:var(--muted);font-size:12px}
    .meta{display:grid;grid-template-columns:minmax(125px,160px) minmax(105px,145px);gap:8px;margin-top:11px;align-items:end}.meta.single{grid-template-columns:minmax(125px,160px)}.meta input[type="date"]{min-width:0;width:100%;font-size:14px;padding:8px 6px}
    label span,.mini{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
    input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:10px;padding:9px}
    .exercise{border-top:1px solid var(--line);padding:13px 0;position:relative}.exercise:first-child{border-top:0}
    .exhead{display:flex;gap:9px;align-items:flex-start}.done{width:22px;height:22px;accent-color:var(--good);margin-top:2px}
    .exname{font-weight:800;line-height:1.2}.target,.last{font-size:12px;color:var(--muted);margin-top:3px}
    .last strong{color:var(--primary)}
    .tools{margin-left:auto;display:flex;gap:5px}
    .smallbtn{border:0;border-radius:9px;padding:7px 9px;background:var(--soft);color:var(--primary);font-weight:750;font-size:12px}
    .sets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
    .setbox{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg2)}
    .setrow{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .setactions{display:flex;gap:5px;margin-top:6px}.setactions button{flex:1}
    .note{margin-top:8px}.tip{margin-top:8px;padding:9px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--muted)}
    .progression{margin-top:8px;padding:9px;border-radius:10px;background:color-mix(in srgb,var(--good) 12%,var(--card));font-size:12px;color:var(--good);font-weight:700}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
    .primary,.secondary,.danger,.warn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}
    .primary{background:var(--primary);color:white}.secondary{background:var(--soft);color:var(--ink)}.danger{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}.warn{background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn)}
    .sticky-workout{position:fixed;left:50%;transform:translateX(-50%);bottom:73px;width:min(860px,calc(100% - 16px));background:var(--card);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.22);border-radius:16px;padding:8px;display:none;z-index:9}
    .sticky-workout.show{display:flex;align-items:center;gap:8px}.sticky-workout .primary{margin-left:auto}
    .timer{font-size:22px;font-weight:850;min-width:72px;text-align:center}
    .progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    canvas{width:100%;height:210px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}th{color:var(--muted);font-size:11px}
    .guide-item{border-top:1px solid var(--line);padding:12px 0}.guide-item:first-child{border-top:0}.guide-item h3{margin:0 0 5px;font-size:16px}
    .guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.guide-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px}
    .guide-box b{display:block;margin-bottom:5px}.guide-box ul{margin:0;padding-left:18px}.guide-box li{margin:4px 0}
    nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}
    .navinner{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
    .navbtn{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:10px;font-size:11px}.navbtn span{display:block;font-size:20px}.navbtn.active{background:var(--soft);color:var(--primary);font-weight:800}
    dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100% - 24px));background:var(--card);color:var(--ink);box-shadow:0 20px 80px rgba(0,0,0,.4)}
    dialog::backdrop{background:rgba(0,0,0,.65)}.modal{padding:17px}.close{float:right}.qr{width:210px;height:210px;border-radius:12px;border:1px solid var(--line);display:block;margin:10px auto}
    .empty{text-align:center;color:var(--muted);padding:18px}
    .badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--primary)}
    @media(max-width:650px){
      .meta{grid-template-columns:minmax(120px,1fr) minmax(95px,.8fr)}.meta.single{grid-template-columns:minmax(120px,160px)}.progress-grid{grid-template-columns:1fr 1fr}.sets{grid-template-columns:1fr}.guide-grid{grid-template-columns:1fr}
      h1{font-size:21px}.tools{flex-direction:column}.smallbtn{padding:6px 8px}
    }
  
.workout-overlay{position:fixed;inset:0;background:linear-gradient(180deg,var(--primary),#082f4b);color:#fff;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.workout-overlay.show{display:flex}.workout-panel{width:min(520px,100%)}.workout-day{font-size:17px;opacity:.85;font-weight:800}
.workout-clock{font-size:clamp(68px,20vw,116px);font-weight:900;line-height:1;margin:28px 0 12px;font-variant-numeric:tabular-nums}
.workout-state{font-size:18px;opacity:.9;margin-bottom:30px}.workout-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.workout-buttons button{padding:17px 12px;border-radius:16px;border:0;font-size:17px;font-weight:850}.workout-buttons .wide{grid-column:1/-1}
.overlay-light{background:#fff;color:#0b5f9b}.overlay-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)!important}.overlay-stop{background:#ffddd9;color:#9d1c13}
.mini-workout-bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:25;display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 10px;box-shadow:0 8px 30px rgba(0,0,0,.22)}
.mini-workout-bar.show{display:flex}.mini-time{font-weight:900;font-variant-numeric:tabular-nums;min-width:58px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="toprow">
    <div><h1>Gym Tracker Pro</h1><div class="subtitle">Rychlé zapisování do telefonu</div></div>
    <div>
      <button class="iconbtn" id="wakeBtn" onclick="toggleWake()">☀️</button>
      <button class="iconbtn" onclick="toggleTheme()">🌙</button>
    </div>
  </div>
  <div class="summary">
    <div class="pill"><b id="weekDone">0/3</b><span>tento týden</span></div>
    <div class="pill"><b id="lastWeight">–</b><span>váha</span></div>
    <div class="pill"><b id="lastWaist">–</b><span>pas</span></div>
  </div>
</header>

<main>
  <section id="monday" class="screen active"></section>
  <section id="wednesday" class="screen"></section>
  <section id="friday" class="screen"></section>

  <section id="progress" class="screen">
    <div class="card">
      <h2 style="margin-top:0">Týdenní progres</h2>
      <div class="progress-grid">
        <label><span>Datum</span><input id="pDate" type="date"></label>
        <label><span>Tělesná váha (kg)</span><input id="pWeight" type="number" step=".1"></label>
        <label><span>Obvod pasu (cm)</span><input id="pWaist" type="number" step=".1"></label>
        <label><span>Cable Crunch – nejlepší série</span><input id="pCrunch" placeholder="17,5 × 15"></label>
      </div>
      <div class="actions">
        <button class="primary" onclick="addProgress()">Uložit měření</button>
        <button class="secondary" onclick="exportData()">Export zálohy</button>
        <label class="secondary">Import<input type="file" accept=".json" hidden onchange="importData(event)"></label>
      </div>
    </div>
    <div class="card"><h3>Vývoj váhy</h3><canvas id="weightChart" width="800" height="260"></canvas></div>
    <div class="card"><h3>Vývoj pasu</h3><canvas id="waistChart" width="800" height="260"></canvas></div>
    <div class="card"><h3>Historie měření</h3><div id="measureHistory"></div></div>
  </section>

  <section id="guide" class="screen">
    <div class="card">
      <h2 style="margin-top:0">Technika cviků</h2>
      <div class="subtitle">Nastavení, provedení, chyby a QR/video.</div>
      <div id="guideList"></div>
    </div>
  </section>
</main>
</div>

<div class="sticky-workout" id="stickyWorkout">
  <span class="badge" id="timerLabel">Pauza</span>
  <div class="timer" id="timerText">01:30</div>
  <button class="secondary" onclick="addTimer(30)">+30 s</button>
  <button class="danger" onclick="stopTimer()">Stop</button>
  <button class="primary" onclick="scrollNext()">Další série ↓</button>
</div>


<div class="mini-workout-bar" id="miniWorkoutBar">
  <span id="miniWorkoutDay" class="badge">Trénink</span>
  <span id="miniWorkoutTime" class="mini-time">00:00</span>
  <button class="smallbtn" onclick="openWorkoutOverlay()">Otevřít</button>
</div>
<div class="workout-overlay" id="workoutOverlay">
  <div class="workout-panel">
    <div class="workout-day" id="workoutOverlayDay">TRÉNINK</div>
    <div class="workout-clock" id="workoutClock">00:00</div>
    <div class="workout-state" id="workoutState">Probíhá</div>
    <div class="workout-buttons">
      <button class="overlay-light" id="pauseWorkoutBtn" onclick="toggleWorkoutPause()">Pozastavit</button>
      <button class="overlay-ghost" onclick="minimizeWorkout()">Zapisovat série</button>
      <button class="overlay-stop wide" onclick="requestFinishWorkout()">Ukončit trénink</button>
    </div>
  </div>
</div>
<nav><div class="navinner">
  <button class="navbtn active" data-screen="monday"><span>🏋️</span>Po</button>
  <button class="navbtn" data-screen="wednesday"><span>💪</span>St</button>
  <button class="navbtn" data-screen="friday"><span>🦵</span>Pá</button>
  <button class="navbtn" data-screen="progress"><span>📈</span>Progres</button>
  <button class="navbtn" data-screen="guide"><span>🎥</span>Technika</button>
</div></nav>

<dialog id="videoDialog"><div class="modal">
  <button class="iconbtn close" onclick="videoDialog.close()">✕</button>
  <h3 id="modalTitle"></h3><img id="qrImg" class="qr">
  <p style="text-align:center"><a id="videoLink" class="primary" style="display:inline-block;text-decoration:none" target="_blank">Otevřít video</a></p>
</div></dialog>

<dialog id="historyDialog"><div class="modal">
  <button class="iconbtn close" onclick="historyDialog.close()">✕</button>
  <h3 id="historyTitle"></h3><div id="exerciseHistory"></div>
</div></dialog>

<dialog id="finishDialog"><div class="modal">
  <button class="iconbtn close" onclick="finishDialog.close()">✕</button>
  <h3>Trénink hotový 🎉</h3><div id="finishSummary"></div>
  <label><span>Poznámka k tréninku</span><textarea id="finishNote" rows="3"></textarea></label>
  <div class="actions"><button class="primary" onclick="saveFinish()">Uložit a ukončit</button></div>
</div></dialog>

const KEY="gymTrackerProV2";
let state=JSON.parse(localStorage.getItem(KEY)||'{"days":{},"history":{},"progress":[],"settings":{"theme":"light"},"workouts":[]}');
let activeDay="monday", timerInt=null, timerSec=0, currentSetEl=null, wakeLock=null; let workoutStart=null,workoutElapsedBeforePause=0,workoutPaused=false,workoutClockInt=null,activeWorkoutDay=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state));refreshSummary()}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function exKey(day,i){return day+"_"+i}

function renderDay(day){
 const p=plans[day], d=state.days[day]||{}, order=d.order||p.ex.map((_,i)=>i);
 let html=`<div class="card"><div class="day-head"><div><h2>${p.title}</h2><p>${p.sub}</p></div>
 <button class="danger" onclick="clearDay('${day}')">Vymazat</button></div>
 <div class="meta ${day==='monday'?'':'single'}">
 <label><span>Datum</span><input type="date" value="${d.date||today()}" oninput="setDay('${day}','date',this.value)"></label>
 ${day==='monday'?`<label><span>Váha (kg) – jen pondělí</span><input type="number" step=".1" value="${esc(d.weight)}" oninput="setDay('${day}','weight',this.value)"></label>`:''}
 </div><div class="actions"><button class="primary" onclick="startWorkout('${day}')">▶ Začít trénink</button></div></div><div class="card">`;
 order.forEach((i,pos)=>{
   const ex=p.ex[i], e=(d.exercises||{})[i]||{}, prev=lastPerformance(day,i), suggestion=getSuggestion(day,i,ex[2]);
   html+=`<div class="exercise" id="ex-${day}-${i}"><div class="exhead">
   <input class="done" type="checkbox" ${e.done?'checked':''} onchange="setEx('${day}',${i},'done',this.checked)">
   <div><div class="exname">${ex[0]} <span style="font-weight:500;color:var(--muted)">(${ex[1]})</span></div>
   <div class="target">${ex[2]}</div><div class="last">${prev?`Minule: <strong>${prev}</strong>`:"Minule: bez záznamu"}</div></div>
   <div class="tools"><button class="smallbtn" onclick="showHistory('${day}',${i})">Historie</button><button class="smallbtn" onclick="showVideo('${encodeURIComponent(ex[1])}','${encodeURIComponent(ex[0])}')">Video</button></div></div>
   <div class="sets">`;
   for(let s=1;s<=3;s++){
     html+=`<div class="setbox" data-set="${day}-${i}-${s}"><span class="mini">Série ${s}</span><div class="setrow">
     <input placeholder="kg" inputmode="decimal" value="${esc(e['kg'+s])}" oninput="setEx('${day}',${i},'kg${s}',this.value)">
     <input placeholder="opak." inputmode="numeric" value="${esc(e['reps'+s])}" oninput="setEx('${day}',${i},'reps${s}',this.value)">
     </div><div class="setactions"><button class="smallbtn" onclick="completeSet('${day}',${i},${s},${ex[3]},this)">Hotovo + pauza</button></div></div>`;
   }
   html+=`</div><input class="note" placeholder="Poznámka / RPE" value="${esc(e.notes)}" oninput="setEx('${day}',${i},'notes',this.value)">
   ${suggestion?`<div class="progression">💡 ${suggestion}</div>`:""}
   <div class="tip"><b>Nedělej:</b> ${ex[5].join(" • ")}</div>
   <div class="actions"><button class="warn" onclick="occupied('${day}',${i})">Stroj obsazený → přesunout dolů</button><button class="secondary" onclick="useAlternative('${day}',${i})">Náhrada: ${ex[6]}</button></div></div>`;
 });
 html+=`<div class="actions"><button class="primary" onclick="finishWorkout('${day}')">Dokončit trénink</button></div></div>`;
 document.getElementById(day).innerHTML=html;
}
function setDay(day,k,v){state.days[day]=state.days[day]||{};state.days[day][k]=v;save()}
function setEx(day,i,k,v){let d=state.days[day]=state.days[day]||{};d.exercises=d.exercises||{};d.exercises[i]=d.exercises[i]||{};d.exercises[i][k]=v;save()}
function lastPerformance(day,i){
 const arr=state.history[exKey(day,i)]||[]; if(!arr.length)return "";
 const x=arr[arr.length-1]; return x.sets.filter(s=>s.kg||s.reps).map(s=>`${s.kg||"–"}×${s.reps||"–"}`).join(" / ");
}
function parseRange(t){let m=t.match(/(\d+)[–-](\d+)/);return m?[+m[1],+m[2]]:null}
function getSuggestion(day,i,target){
 const arr=state.history[exKey(day,i)]||[]; if(!arr.length)return "";
 const x=arr[arr.length-1], range=parseRange(target); if(!range)return "";
 const valid=x.sets.filter(s=>+s.reps); if(valid.length>=3 && valid.every(s=>+s.reps>=range[1])) return "Všechny pracovní série jsou na horní hranici. Příště zkus malý krok nahoru ve váze.";
 if(valid.length>=3 && valid.some(s=>+s.reps<range[0])) return "Nejdřív drž stejnou váhu a dostaň všechny série alespoň na spodní hranici.";
 return "Zkus přidat 1 opakování v jedné nebo více sériích.";
}
function completeSet(day,i,s,rest,btn){
 currentSetEl=btn.closest(".setbox"); currentSetEl.style.outline="2px solid var(--good)";
 startTimer(rest||75); navigator.vibrate?.(40);
 const inputs=currentSetEl.querySelectorAll("input"); inputs.forEach(x=>x.blur());
 scrollNext();
}
function startWorkout(day){
 activeDay=day;activeWorkoutDay=day;workoutStart=Date.now();workoutElapsedBeforePause=0;workoutPaused=false;
 state.days[day]=state.days[day]||{};state.days[day].startedAt=new Date().toISOString();save();
 workoutOverlayDay.textContent=plans[day].title;workoutState.textContent="Probíhá";pauseWorkoutBtn.textContent="Pozastavit";
 workoutOverlay.classList.add("show");miniWorkoutBar.classList.remove("show");updateWorkoutClock();
 clearInterval(workoutClockInt);workoutClockInt=setInterval(updateWorkoutClock,500);
 document.documentElement.requestFullscreen?.().catch(()=>{});
}
function getWorkoutElapsed(){return workoutElapsedBeforePause+(workoutPaused?0:Math.max(0,Date.now()-workoutStart))}
function formatClock(ms){const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function updateWorkoutClock(){const x=formatClock(getWorkoutElapsed());workoutClock.textContent=x;miniWorkoutTime.textContent=x}
function toggleWorkoutPause(){if(!activeWorkoutDay)return;if(workoutPaused){workoutPaused=false;workoutStart=Date.now();workoutState.textContent="Probíhá";pauseWorkoutBtn.textContent="Pozastavit"}else{workoutElapsedBeforePause+=Date.now()-workoutStart;workoutPaused=true;workoutState.textContent="Pozastaveno";pauseWorkoutBtn.textContent="Pokračovat"}updateWorkoutClock()}
function minimizeWorkout(){workoutOverlay.classList.remove("show");miniWorkoutBar.classList.add("show");miniWorkoutDay.textContent=plans[activeWorkoutDay].title.replace(/ –.*/,"");document.exitFullscreen?.().catch(()=>{})}
function openWorkoutOverlay(){if(activeWorkoutDay){workoutOverlay.classList.add("show");miniWorkoutBar.classList.remove("show")}}
function requestFinishWorkout(){if(activeWorkoutDay&&confirm("Opravdu ukončit trénink?"))finishWorkout(activeWorkoutDay)}
function finishWorkout(day){
 const d=state.days[day]||{},p=plans[day],done=Object.values(d.exercises||{}).filter(x=>x.done).length,minutes=Math.max(1,Math.round(getWorkoutElapsed()/60000));
 workoutOverlay.classList.remove("show");miniWorkoutBar.classList.remove("show");clearInterval(workoutClockInt);document.exitFullscreen?.().catch(()=>{});
 finishSummary.innerHTML=`<p><b>${p.title}</b></p><p>Čas: <b>${minutes} min</b><br>Dokončené cviky: <b>${done}/${p.ex.length}</b></p>`;
 finishDialog.dataset.day=day;finishDialog.dataset.minutes=minutes;finishDialog.showModal();
}
function saveFinish(){
 const day=finishDialog.dataset.day, d=state.days[day]||{}, p=plans[day];
 Object.entries(d.exercises||{}).forEach(([i,e])=>{
   const sets=[1,2,3].map(s=>({kg:e["kg"+s]||"",reps:e["reps"+s]||""}));
   if(sets.some(s=>s.kg||s.reps)){let k=exKey(day,i);state.history[k]=state.history[k]||[];state.history[k].push({date:d.date||today(),sets,notes:e.notes||""})}
 });
 state.workouts.push({day,date:d.date||today(),minutes:+finishDialog.dataset.minutes,note:finishNote.value,completed:true});
 state.days[day].completed=true;save();finishDialog.close();finishNote.value="";renderDay(day);activeWorkoutDay=null;workoutStart=null;workoutElapsedBeforePause=0;workoutPaused=false;alert("Uloženo ✅");
}
function clearDay(day){if(confirm("Vymazat aktuální zápis dne? Historie zůstane zachována.")){delete state.days[day];save();renderDay(day)}}
function occupied(day,i){
 let d=state.days[day]=state.days[day]||{}, arr=d.order||plans[day].ex.map((_,x)=>x);arr=arr.filter(x=>x!==i);arr.push(i);d.order=arr;save();renderDay(day);
 setTimeout(()=>document.getElementById(`ex-${day}-${i}`)?.scrollIntoView({behavior:"smooth",block:"center"}),100);
}
function useAlternative(day,i){const alt=plans[day].ex[i][6];setEx(day,i,"notes",(state.days[day]?.exercises?.[i]?.notes||"")+` Náhrada: ${alt}.`);alert(`Použij: ${alt}`);renderDay(day)}
function showHistory(day,i){
 const ex=plans[day].ex[i], arr=[...(state.history[exKey(day,i)]||[])].reverse();
 historyTitle.textContent=ex[0]; exerciseHistory.innerHTML=arr.length?`<table><tr><th>Datum</th><th>Série</th><th>Poznámka</th></tr>${arr.map(x=>`<tr><td>${x.date}</td><td>${x.sets.map(s=>`${esc(s.kg)||"–"}×${esc(s.reps)||"–"}`).join("<br>")}</td><td>${esc(x.notes)}</td></tr>`).join("")}</table>`:`<div class="empty">Zatím bez historie.</div>`;
 historyDialog.showModal();
}
function showVideo(query,title){
 const q=decodeURIComponent(query),t=decodeURIComponent(title),url="https://www.youtube.com/results?search_query="+encodeURIComponent(q+" proper form tutorial");
 modalTitle.textContent=t;videoLink.href=url;qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(url);videoDialog.showModal();
}
function startTimer(sec){timerSec=sec;stickyWorkout.classList.add("show");clearInterval(timerInt);renderTimer();timerInt=setInterval(()=>{timerSec--;renderTimer();if(timerSec<=0){clearInterval(timerInt);navigator.vibrate?.([200,100,200]);beep();timerLabel.textContent="Jdeme!";}},1000)}
function renderTimer(){timerText.textContent=String(Math.floor(timerSec/60)).padStart(2,"0")+":"+String(Math.max(0,timerSec%60)).padStart(2,"0")}
function addTimer(s){timerSec+=s;renderTimer()}
function stopTimer(){clearInterval(timerInt);stickyWorkout.classList.remove("show");timerLabel.textContent="Pauza"}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch{}}
function scrollNext(){
 const focus=[...document.querySelectorAll(`#${activeDay} .setbox input`)].find(x=>!x.value);
 if(focus){focus.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>focus.focus(),300)}
}
async function toggleWake(){
 try{
   if(wakeLock){await wakeLock.release();wakeLock=null;wakeBtn.textContent="☀️"}
   else{wakeLock=await navigator.wakeLock.request("screen");wakeBtn.textContent="🔒"}
 }catch{alert("Tento prohlížeč neumí držet obrazovku zapnutou.")}
}
function toggleTheme(){state.settings=state.settings||{};state.settings.theme=state.settings.theme==="dark"?"light":"dark";applyTheme();save()}
function applyTheme(){document.documentElement.dataset.theme=state.settings?.theme||"light"}

function renderGuide(){
 let seen=new Set(),html="";
 Object.values(plans).flatMap(p=>p.ex).forEach(ex=>{if(seen.has(ex[1]))return;seen.add(ex[1]);
 html+=`<div class="guide-item"><h3>${ex[0]} <span class="subtitle">(${ex[1]})</span></h3>
 <div class="guide-grid"><div class="guide-box"><b>Jak na to</b><ul>${ex[4].map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <div class="guide-box"><b>Nejčastější chyby</b><ul>${ex[5].map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
 <div class="actions"><button class="smallbtn" onclick="showVideo('${encodeURIComponent(ex[1])}','${encodeURIComponent(ex[0])}')">Video / QR</button></div></div>`;
 });guideList.innerHTML=html;
}
function addProgress(){let x={date:pDate.value||today(),weight:pWeight.value,waist:pWaist.value,crunch:pCrunch.value};if(!x.weight&&!x.waist&&!x.crunch)return alert("Vyplň alespoň jednu hodnotu.");state.progress.push(x);state.progress.sort((a,b)=>a.date.localeCompare(b.date));save();pWeight.value=pWaist.value=pCrunch.value="";renderProgress()}
function deleteProgress(i){if(confirm("Smazat měření?")){state.progress.splice(i,1);save();renderProgress()}}
function renderProgress(){
 let rows=[...state.progress].reverse();measureHistory.innerHTML=rows.length?`<table><tr><th>Datum</th><th>Váha</th><th>Pas</th><th>Crunch</th><th></th></tr>${rows.map((r,rev)=>{let i=state.progress.length-1-rev;return `<tr><td>${r.date}</td><td>${r.weight||"–"}</td><td>${r.waist||"–"}</td><td>${r.crunch||"–"}</td><td><button class="danger" onclick="deleteProgress(${i})">×</button></td></tr>`}).join("")}</table>`:`<div class="empty">Zatím žádná měření.</div>`;
 drawChart("weightChart","weight","kg");drawChart("waistChart","waist","cm");
}
function drawChart(id,key,unit){
 const c=document.getElementById(id),ctx=c.getContext("2d"),data=state.progress.filter(x=>x[key]).map(x=>({x:x.date,y:+x[key]}));ctx.clearRect(0,0,c.width,c.height);ctx.font="14px system-ui";ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--muted");
 if(data.length<2){ctx.fillText("Přidej alespoň 2 měření.",25,45);return}
 const pad=45,min=Math.min(...data.map(d=>d.y)),max=Math.max(...data.map(d=>d.y)),range=max-min||1;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--line");ctx.lineWidth=1;
 for(let i=0;i<5;i++){let y=pad+i*(c.height-2*pad)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(c.width-pad,y);ctx.stroke()}
 ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--primary");ctx.lineWidth=4;ctx.beginPath();data.forEach((d,i)=>{let x=pad+i*(c.width-2*pad)/(data.length-1),y=c.height-pad-(d.y-min)/range*(c.height-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink");ctx.fillText(`${max.toFixed(1)} ${unit}`,5,pad);ctx.fillText(`${min.toFixed(1)} ${unit}`,5,c.height-pad);
}
function refreshSummary(){
 const cutoff=new Date();cutoff.setDate(cutoff.getDate()-7);const done=state.workouts.filter(w=>new Date(w.date)>=cutoff&&w.completed).length;weekDone.textContent=Math.min(done,3)+"/3";
 const p=state.progress.at(-1);lastWeight.textContent=p?.weight?p.weight+" kg":"–";lastWaist.textContent=p?.waist?p.waist+" cm":"–";
}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="gym-tracker-zaloha.json";a.click();URL.revokeObjectURL(a.href);localStorage.setItem("lastBackup",Date.now())}
function importData(e){const f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();location.reload()}catch{alert("Neplatná záloha.")}};r.readAsText(f)}
function backupReminder(){const last=+(localStorage.getItem("lastBackup")||0);if(Date.now()-last>7*864e5&&state.workouts.length) setTimeout(()=>confirm("Už je to déle než týden od zálohy. Chceš ji teď stáhnout?")&&exportData(),1200)}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.screen).classList.add("active");if(["monday","wednesday","friday"].includes(b.dataset.screen))activeDay=b.dataset.screen;if(b.dataset.screen==="progress")renderProgress()});
applyTheme();["monday","wednesday","friday"].forEach(renderDay);renderGuide();renderProgress();refreshSummary();pDate.value=today();backupReminder();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
