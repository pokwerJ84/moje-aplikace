name: Publish technical dictionary

on:
  push:
    branches: [main]
    paths:
      - 'technicky-slovnik/site/**'
      - '.github/workflows/technicky-slovnik-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: technicky-slovnik/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
